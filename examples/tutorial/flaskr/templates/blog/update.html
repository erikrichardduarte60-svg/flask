{% extends 'base.html' %}

{% block header %}
    <h1 class="h2 mb-4">{% block title %}Editar "{{ post.title }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Título</label>
                            <input name="title" id="title" class="form-control"
                                value="{{ request.form['title'] or post.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="body" class="form-label">Texto</label>
                            <textarea name="body" id="body" rows="5"
                                class="form-control">{{ request.form['body'] or post.body }}</textarea>
                        </div>
                        {% if post.imagem_post %}
                            <div class="mb-3">
                                <p class="form-label mb-1">Imagem atual</p>
                                <img src="{{ url_for('static', filename='uploads/' ~ post.imagem_post) }}"
                                    class="img-thumbnail" style="max-height: 150px;" alt="Imagem atual">
                            </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="imagem" class="form-label">Trocar imagem (opcional)</label>
                            <input type="file" name="imagem" id="imagem" class="form-control"
                                accept="image/*">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <a href="{{ url_for('blog.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                    <hr>
                    <form action="{{ url_for('blog.delete', id=post.id) }}" method="post"
                        onsubmit="return confirm('Tem certeza que deseja excluir este post?');">
                        <button type="submit" class="btn btn-outline-danger">Excluir post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
